<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DEEP // Command Center</title>
<style>
:root{
  --bg:#070A0F; --bg2:#0A0E16; --panel:rgba(14,22,34,.45);
  --cyan:#00E5FF; --orange:#FF8A00; --dim:#5B6B7A; --text:#CFE9F2;
  --grid:rgba(0,229,255,.06);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:'Rajdhani','Segoe UI',system-ui,sans-serif;letter-spacing:.5px}
body{
  background:
    radial-gradient(1200px 800px at 50% 45%, #0C1320 0%, var(--bg) 70%),
    repeating-linear-gradient(0deg,transparent 0 39px,var(--grid) 39px 40px),
    repeating-linear-gradient(90deg,transparent 0 39px,var(--grid) 39px 40px);
}
.vignette{position:fixed;inset:0;pointer-events:none;z-index:50;
  box-shadow:inset 0 0 280px 60px rgba(0,0,0,.9)}
.scanlines{position:fixed;inset:0;pointer-events:none;z-index:51;opacity:.35;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,0) 0 2px,rgba(0,0,0,.25) 2px 3px);
  animation:scanmove 8s linear infinite}
@keyframes scanmove{to{background-position:0 120px}}
.flicker{position:fixed;inset:0;pointer-events:none;z-index:52;
  background:var(--cyan);mix-blend-mode:overlay;opacity:0;animation:flick 7s infinite}
@keyframes flick{0%,97%,100%{opacity:0}98%{opacity:.025}}

#app{position:relative;height:100vh;width:100vw;z-index:1;
  display:grid;grid-template-columns:300px 1fr 300px;grid-template-rows:64px 1fr 150px;
  gap:18px;padding:18px}
.col{display:flex;flex-direction:column;gap:18px;min-height:0}

.panel{position:relative;background:var(--panel);backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);border:1px solid rgba(0,229,255,.22);
  border-radius:14px;padding:14px 16px;box-shadow:0 0 0 1px rgba(0,0,0,.4),
  0 8px 40px rgba(0,0,0,.5),inset 0 0 30px rgba(0,229,255,.04);
  transform-style:preserve-3d;transition:box-shadow .3s,border-color .3s}
.panel::before{content:'';position:absolute;top:-1px;left:14px;width:40px;height:2px;
  background:var(--cyan);box-shadow:0 0 10px var(--cyan);border-radius:2px}
.panel:hover{border-color:rgba(0,229,255,.55);
  box-shadow:0 0 0 1px rgba(0,229,255,.3),0 10px 50px rgba(0,229,255,.12),
  inset 0 0 40px rgba(0,229,255,.07)}
.p-title{font-size:11px;letter-spacing:3px;color:var(--cyan);text-transform:uppercase;
  display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;opacity:.85}
.p-title::after{content:'';flex:1;height:1px;margin-left:10px;
  background:linear-gradient(90deg,rgba(0,229,255,.4),transparent)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--orange);
  box-shadow:0 0 8px var(--orange);animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.4}50%{opacity:1}}

.header{grid-column:1/4;display:flex;align-items:center;justify-content:space-between;padding:0 8px}
.brand{font-size:26px;font-weight:700;letter-spacing:12px;color:#EAF7FB;
  text-shadow:0 0 22px rgba(0,229,255,.55)}
.brand b{color:var(--cyan)}
.sub{font-size:10px;letter-spacing:4px;color:var(--dim)}
.hdr-stats{display:flex;gap:22px;font-size:11px;letter-spacing:2px;color:var(--dim)}
.hdr-stats b{color:var(--cyan);font-weight:600}

.center{grid-row:2;display:flex;flex-direction:column;align-items:center;
  justify-content:center;position:relative}
#orbWrap{position:relative;width:440px;height:440px;display:flex;align-items:center;justify-content:center}
#orb{width:100%;height:100%;overflow:visible}
.ring{fill:none;stroke-linecap:round;transform-origin:220px 220px}
.r-spin1{animation:spin 18s linear infinite}
.r-spin2{animation:spin 26s linear infinite reverse}
.r-spin3{animation:spin 40s linear infinite}
.r-spin4{animation:spin 12s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
#core{transform-origin:220px 220px;animation:pulse 3.2s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(.96);opacity:.85}50%{transform:scale(1.06);opacity:1}}
.orb-state{position:absolute;bottom:6px;text-align:center;width:100%;
  font-size:11px;letter-spacing:5px;color:var(--cyan);text-transform:uppercase}
.tick{stroke:var(--cyan);stroke-width:1.4;opacity:.5}

.feed{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:9px;padding-right:6px;font-size:13px}
.feed::-webkit-scrollbar{width:5px}.feed::-webkit-scrollbar-thumb{background:rgba(0,229,255,.3);border-radius:3px}
.msg{padding:9px 12px;border-radius:9px;line-height:1.5;max-width:100%}
.msg.me{background:rgba(255,138,0,.10);border:1px solid rgba(255,138,0,.35);align-self:flex-end}
.msg.ai{background:rgba(0,229,255,.07);border:1px solid rgba(0,229,255,.28)}
.msg .tag{font-size:9px;letter-spacing:2px;color:var(--orange);display:block;margin-bottom:3px}

.metric{display:flex;justify-content:space-between;align-items:baseline;margin:7px 0}
.metric .v{font-size:24px;font-weight:700;color:#EAF7FB}
.metric .u{font-size:10px;color:var(--dim);letter-spacing:2px}
.bar{height:5px;border-radius:3px;background:rgba(255,255,255,.06);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--orange));
  box-shadow:0 0 10px var(--cyan);transition:width .6s ease}
.clock{font-size:34px;font-weight:700;color:#EAF7FB;text-align:center;
  text-shadow:0 0 18px rgba(0,229,255,.4);font-variant-numeric:tabular-nums}
.clock .d{font-size:11px;letter-spacing:4px;color:var(--dim);margin-top:4px}
.domain{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.domain span{font-size:9px;letter-spacing:1px;padding:3px 7px;border-radius:20px;
  border:1px solid rgba(0,229,255,.2);color:var(--dim);transition:.3s}
.domain span.on{color:var(--cyan);border-color:rgba(0,229,255,.6);box-shadow:0 0 8px rgba(0,229,255,.25)}

.dock{grid-column:1/4;grid-row:3;display:flex;flex-direction:column;gap:8px}
#wave{width:100%;height:46px;display:block}
.cmd{display:flex;gap:12px;align-items:center}
.cmd input{flex:1;background:rgba(8,14,22,.6);border:1px solid rgba(0,229,255,.3);
  border-radius:30px;padding:14px 22px;color:var(--text);font-size:15px;outline:none;
  font-family:inherit;letter-spacing:1px}
.cmd input:focus{border-color:var(--cyan);box-shadow:0 0 18px rgba(0,229,255,.25)}
.btn{cursor:pointer;border:1px solid rgba(0,229,255,.4);background:rgba(0,229,255,.08);
  color:var(--cyan);border-radius:30px;padding:0 22px;height:50px;font-size:12px;
  letter-spacing:3px;font-family:inherit;font-weight:600;transition:.2s;text-transform:uppercase}
.btn:hover{background:rgba(0,229,255,.18);box-shadow:0 0 18px rgba(0,229,255,.35)}
.btn.mic{width:52px;padding:0;font-size:18px}
.btn.mic.live{color:var(--orange);border-color:var(--orange);box-shadow:0 0 18px var(--orange);animation:breathe 1s infinite}

.boot-hidden{opacity:0}
.slide-l{animation:slideL .9s cubic-bezier(.2,.8,.2,1) forwards}
.slide-r{animation:slideR .9s cubic-bezier(.2,.8,.2,1) forwards}
.slide-d{animation:slideD .9s cubic-bezier(.2,.8,.2,1) forwards}
.fade-in{animation:fade 1.2s ease forwards}
@keyframes slideL{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:none}}
@keyframes slideR{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:none}}
@keyframes slideD{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
#orbWrap.assemble{animation:assemble 1.4s cubic-bezier(.2,1.2,.3,1) forwards}
@keyframes assemble{from{opacity:0;transform:scale(.2) rotate(-90deg)}to{opacity:1;transform:none}}
#bootScreen{position:fixed;inset:0;z-index:80;background:var(--bg);display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .8s}
#bootScreen .bl{font-size:12px;letter-spacing:3px;color:var(--cyan);opacity:0;font-family:'Courier New',monospace}
.typing{overflow:hidden;white-space:nowrap;border-right:2px solid var(--cyan)}
.glitch{animation:glitch .25s steps(2) 2}
@keyframes glitch{0%{clip-path:inset(0 0 60% 0);transform:translateX(-2px)}
  50%{clip-path:inset(50% 0 0 0);transform:translateX(2px)}100%{transform:none}}
</style>
</head>
<body>
<div class="vignette"></div><div class="scanlines"></div><div class="flicker"></div>

<div id="bootScreen">
  <div style="font-size:30px;letter-spacing:14px;color:#EAF7FB;text-shadow:0 0 30px var(--cyan)">M A N A S</div>
  <div id="bootLog" style="height:120px;text-align:left;width:340px"></div>
</div>

<div id="app">
  <div class="header boot-hidden" data-boot="slide-d">
    <div><div class="brand">M<b>A</b>N<b>A</b>S</div>
      <div class="sub">FULL-SPECTRUM INTELLIGENCE SYSTEM &middot; 16 DOMAINS</div></div>
    <div class="hdr-stats">
      <div>STATUS <b id="hConn">LINKING&hellip;</b></div>
      <div>UPTIME <b id="hUp">00:00:00</b></div>
      <div>LAT <b id="hLat">-- ms</b></div>
    </div>
  </div>

  <div class="col" style="grid-row:2">
    <div class="panel boot-hidden" data-boot="slide-l">
      <div class="p-title">System Health <span class="dot"></span></div>
      <div class="metric"><span class="u">CPU LOAD</span><span><span class="v" id="mCpu">--</span><span class="u">%</span></span></div>
      <div class="bar"><i id="bCpu" style="width:0"></i></div>
      <div class="metric"><span class="u">MEMORY</span><span><span class="v" id="mRam">--</span><span class="u">%</span></span></div>
      <div class="bar"><i id="bRam" style="width:0"></i></div>
      <div class="metric"><span class="u">CORES</span><span class="v" id="mCores">--</span></div>
    </div>
    <div class="panel boot-hidden" data-boot="slide-l" style="flex:1">
      <div class="p-title">Active Domains</div>
      <div class="domain" id="domains"></div>
    </div>
  </div>

  <div class="center boot-hidden" data-boot="fade-in">
    <div id="orbWrap">
      <svg id="orb" viewBox="0 0 440 440">
        <defs>
          <radialGradient id="coreGrad"><stop offset="0%" stop-color="#EAFBFF"/>
            <stop offset="40%" stop-color="#00E5FF"/><stop offset="100%" stop-color="#003844"/></radialGradient>
          <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        </defs>
        <circle class="ring r-spin3" cx="220" cy="220" r="205" stroke="rgba(0,229,255,.12)" stroke-width="1"/>
        <circle class="ring r-spin1" cx="220" cy="220" r="180" stroke="#00E5FF" stroke-width="1.5"
          stroke-dasharray="2 26" filter="url(#glow)" opacity=".7"/>
        <circle class="ring r-spin2" cx="220" cy="220" r="155" stroke="#FF8A00" stroke-width="2"
          stroke-dasharray="120 360" filter="url(#glow)" opacity=".6"/>
        <circle class="ring r-spin4" cx="220" cy="220" r="128" stroke="#00E5FF" stroke-width="1"
          stroke-dasharray="6 10" opacity=".5"/>
        <g id="ticks"></g>
        <circle class="ring r-spin1" cx="220" cy="220" r="100" stroke="#00E5FF" stroke-width="3"
          stroke-dasharray="200 60 40 60" filter="url(#glow)" opacity=".8"/>
        <circle id="core" cx="220" cy="220" r="58" fill="url(#coreGrad)" filter="url(#glow)"/>
        <circle cx="220" cy="220" r="58" fill="none" stroke="#EAFBFF" stroke-width="1" opacity=".4"/>
      </svg>
      <div class="orb-state" id="orbState">IDLE</div>
    </div>
  </div>

  <div class="col" style="grid-row:2">
    <div class="panel boot-hidden" data-boot="slide-r">
      <div class="p-title">Chronometer</div>
      <div class="clock" id="clock">--:--:--</div>
      <div class="clock d" id="cdate">&mdash; &middot; &mdash; &middot; &mdash;</div>
    </div>
    <div class="panel boot-hidden" data-boot="slide-r" style="flex:1;display:flex;flex-direction:column">
      <div class="p-title">Intelligence Feed</div>
      <div class="feed" id="feed">
        <div class="msg ai"><span class="tag">DEEP</span>All sixteen domains active. Awaiting directive, sir.</div>
      </div>
    </div>
  </div>

  <div class="dock boot-hidden" data-boot="slide-d">
    <canvas id="wave"></canvas>
    <div class="cmd panel" style="padding:8px 10px">
      <input id="input" placeholder="// issue a directive — e.g. integrate x^2 from 0 to 3" autocomplete="off"/>
      <button class="btn mic" id="mic" title="voice">&#9673;</button>
      <button class="btn" id="send">Execute</button>
    </div>
  </div>
</div>

<script>
/* ── UI SOUND ENGINE (synthesized WebAudio) ── */
const Sound=(()=>{let ctx;
  const ac=()=>ctx||(ctx=new (window.AudioContext||window.webkitAudioContext)());
  const tone=(f,d,type='sine',g=.05)=>{try{const c=ac();const o=c.createOscillator(),gn=c.createGain();
    o.type=type;o.frequency.value=f;gn.gain.value=g;o.connect(gn);gn.connect(c.destination);
    const t=c.currentTime;gn.gain.setValueAtTime(g,t);gn.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.start(t);o.stop(t+d);}catch(e){}};
  return{blip:()=>tone(880,.08,'triangle',.04),click:()=>tone(420,.05,'square',.03),
    hum:()=>{tone(110,.5,'sine',.02);tone(165,.5,'sine',.015);},
    alert:()=>{tone(660,.12,'sawtooth',.04);setTimeout(()=>tone(990,.12,'sawtooth',.04),120);},
    boot:()=>{[220,330,440,660,880].forEach((f,i)=>setTimeout(()=>tone(f,.18,'sine',.04),i*120));}};
})();

/* ── ORB STATE ── */
const orbState=document.getElementById('orbState'),core=document.getElementById('core');
function setState(s){orbState.textContent=s.toUpperCase();
  const map={idle:{c:'#00E5FF',sp:'3.2s'},listening:{c:'#FF8A00',sp:'1.1s'},
    thinking:{c:'#FF3B6B',sp:'.7s'},speaking:{c:'#00E5FF',sp:'1.6s'}};
  const m=map[s]||map.idle;core.style.animationDuration=m.sp;orbState.style.color=m.c;}
(()=>{const g=document.getElementById('ticks');let h='';
  for(let i=0;i<60;i++){const a=i*6*Math.PI/180,r1=i%5?138:130,r2=145;
    h+=`<line class="tick" x1="${220+r1*Math.cos(a)}" y1="${220+r1*Math.sin(a)}" x2="${220+r2*Math.cos(a)}" y2="${220+r2*Math.sin(a)}" opacity="${i%5?.3:.6}"/>`;}
  g.innerHTML=h;})();

/* ── CLOCK + UPTIME ── */
function tick(){const d=new Date();
  document.getElementById('clock').textContent=d.toLocaleTimeString('en-GB');
  document.getElementById('cdate').textContent=
    d.toLocaleDateString('en-GB',{weekday:'long',day:'2-digit',month:'short',year:'numeric'}).toUpperCase();}
setInterval(tick,1000);tick();
const t0=Date.now();
setInterval(()=>{let s=(Date.now()-t0)/1000|0;
  document.getElementById('hUp').textContent=[s/3600|0,s/60%60|0,s%60].map(n=>String(n|0).padStart(2,'0')).join(':');},1000);

/* ── DOMAINS ── */
const DOMAINS=['MATH','PHYSICS','QUANTUM','CHEMISTRY','BIOLOGY','GENOMICS','ASTRO','NUCLEAR',
  'ML','NEURAL','GNN','PINN','ROBOTICS','VISION','NLP','CYBER','ENGINEERING','GAMING','CLOUD','FINANCE'];
document.getElementById('domains').innerHTML=DOMAINS.map(d=>`<span>${d}</span>`).join('');
function flashDomain(name){const el=[...document.querySelectorAll('#domains span')]
  .find(e=>name&&e.textContent&&name.includes(e.textContent));
  if(el){el.classList.add('on');setTimeout(()=>el.classList.remove('on'),3000);}}

/* ── TYPEWRITER / GLITCH FEED ── */
const feed=document.getElementById('feed');
function addMsg(text,cls,tag){const d=document.createElement('div');d.className='msg '+cls;
  if(tag)d.innerHTML=`<span class="tag">${tag}</span>`;
  const span=document.createElement('span');d.appendChild(span);feed.appendChild(d);
  feed.scrollTop=feed.scrollHeight;
  if(cls==='ai'){d.classList.add('glitch');let i=0;
    (function ty(){if(i<=text.length){span.textContent=text.slice(0,i++);feed.scrollTop=feed.scrollHeight;setTimeout(ty,9);}})();}
  else span.textContent=text;}

/* ── CONNECTION + COMMANDS ── */
let ws,lastSent=0;
function connect(){const proto=location.protocol==='https:'?'wss':'ws';
  ws=new WebSocket(`${proto}://${location.host}/ws`);
  ws.onopen=()=>{document.getElementById('hConn').textContent='ONLINE';Sound.hum();};
  ws.onclose=()=>{document.getElementById('hConn').textContent='OFFLINE';setTimeout(connect,2000);};
  ws.onmessage=e=>{const o=JSON.parse(e.data);
    document.getElementById('hLat').textContent=(Date.now()-lastSent)+' ms';
    setState('speaking');Sound.blip();
    addMsg(o.verbal||JSON.stringify(o),'ai',(o.module||'DEEP').toUpperCase());
    flashDomain((o.module||'').toUpperCase());setTimeout(()=>setState('idle'),1200);};}
connect();
const input=document.getElementById('input');
function send(){const v=input.value.trim();if(!v)return;
  addMsg(v,'me');input.value='';Sound.click();setState('thinking');lastSent=Date.now();
  if(ws&&ws.readyState===1)ws.send(v);
  else fetch('/command',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:v})})
    .then(r=>r.json()).then(o=>{setState('speaking');
      addMsg(o.verbal||'…','ai',(o.module||'DEEP').toUpperCase());setTimeout(()=>setState('idle'),1200);});}
document.getElementById('send').onclick=send;
input.addEventListener('keydown',e=>{if(e.key==='Enter')send();});
document.getElementById('send').addEventListener('mouseenter',()=>Sound.blip());

/* ── STATUS POLL ── */
async function poll(){try{const s=await(await fetch('/status')).json();
  if(s.cpu){const c=Math.round(s.cpu.percent);document.getElementById('mCpu').textContent=c;
    document.getElementById('bCpu').style.width=c+'%';document.getElementById('mCores').textContent=s.cpu.cores||'--';}
  if(s.ram){const r=Math.round(s.ram.percent);document.getElementById('mRam').textContent=r;
    document.getElementById('bRam').style.width=r+'%';}}catch(e){}}
poll();setInterval(poll,2500);

/* ── WAVEFORM VISUALISER ── */
const wave=document.getElementById('wave'),wc=wave.getContext('2d');
function rsz(){wave.width=wave.clientWidth*devicePixelRatio;wave.height=46*devicePixelRatio;}
rsz();addEventListener('resize',rsz);
let analyser,freq,micOn=false;
async function initMic(){try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});
  const ac=new (window.AudioContext||window.webkitAudioContext)();const src=ac.createMediaStreamSource(stream);
  analyser=ac.createAnalyser();analyser.fftSize=128;freq=new Uint8Array(analyser.frequencyBinCount);
  src.connect(analyser);micOn=true;}catch(e){micOn=false;}}
function drawWave(){requestAnimationFrame(drawWave);const W=wave.width,H=wave.height;wc.clearRect(0,0,W,H);
  const n=48,bw=W/n;if(micOn&&analyser)analyser.getByteFrequencyData(freq);
  for(let i=0;i<n;i++){let v=micOn&&freq?freq[i%freq.length]/255:(Math.sin(Date.now()/300+i*.5)*.5+.5)*.25+.04;
    const h=Math.max(2,v*H);const grad=wc.createLinearGradient(0,H,0,H-h);
    grad.addColorStop(0,'rgba(0,229,255,.15)');grad.addColorStop(1,'#00E5FF');wc.fillStyle=grad;
    wc.fillRect(i*bw+bw*.2,(H-h)/2,bw*.6,h);wc.fillStyle='rgba(255,138,0,.5)';wc.fillRect(i*bw+bw*.2,H/2-1,bw*.6,2);}}
drawWave();

/* ── VOICE (Web Speech API) ── */
const mic=document.getElementById('mic');
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
mic.onclick=async()=>{await initMic();
  if(SR){const rec=new SR();rec.lang='en-US';rec.interimResults=false;
    mic.classList.add('live');setState('listening');Sound.blip();rec.start();
    rec.onresult=e=>{input.value=e.results[0][0].transcript;mic.classList.remove('live');send();};
    rec.onend=()=>{mic.classList.remove('live');if(orbState.textContent==='LISTENING')setState('idle');};}
  else{setState('listening');setTimeout(()=>setState('idle'),1500);}};

/* ── 3D TILT ── */
document.querySelectorAll('.panel').forEach(p=>{p.style.transition='transform .15s ease, box-shadow .3s';
  p.addEventListener('mousemove',e=>{const r=p.getBoundingClientRect();
    const rx=((e.clientY-r.top)/r.height-.5)*-8,ry=((e.clientX-r.left)/r.width-.5)*8;
    p.style.transform=`perspective(1000px) rotateX(${rx}deg) rotateY(${ry}deg)`;});
  p.addEventListener('mouseleave',()=>p.style.transform='perspective(1000px)');});

/* ── BOOT SEQUENCE ── */
const BOOT=['> initialising kernel…','> mounting 16 intelligence domains…','> linking neural core…',
  '> calibrating quantum lattice…','> DEEP online.'];
const bootLog=document.getElementById('bootLog');
function runBoot(){Sound.boot();let i=0;
  (function line(){if(i<BOOT.length){const d=document.createElement('div');d.className='bl typing';
    d.style.opacity=1;d.textContent=BOOT[i];bootLog.appendChild(d);Sound.click();i++;setTimeout(line,360);}
   else setTimeout(reveal,500);})();}
function reveal(){const bs=document.getElementById('bootScreen');bs.style.opacity=0;
  setTimeout(()=>bs.remove(),800);
  document.getElementById('orbWrap').classList.add('assemble');
  document.querySelectorAll('[data-boot]').forEach((el,i)=>setTimeout(()=>{
    el.classList.remove('boot-hidden');el.classList.add(el.dataset.boot);Sound.blip();},150+i*120));
  setState('idle');}
