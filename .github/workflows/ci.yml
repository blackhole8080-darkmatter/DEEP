name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linux audio build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Lint with Ruff
        run: |
          ruff check .

      - name: Type check with mypy
        run: |
          mypy core/ engine/ ai/ mcp_server/ interface/server.py || true

      - name: Run tests
        run: |
          pytest

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: interface/web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: interface/web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck, production build, and artifact check
        run: npm run build:check
